<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Skyworld Solutions</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .container {
        text-align: center;
        max-width: 450px;
      }
      .code {
        font-size: 8rem;
        font-weight: 200;
        color: #e2e8f0;
        line-height: 1;
        margin-bottom: 24px;
        position: relative;
      }
      .code::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 2px;
        background: linear-gradient(90deg, #06b6d4, #2563eb);
        border-radius: 2px;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 12px;
        color: #1e293b;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
        color: #64748b;
        margin-bottom: 32px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        font-size: 0.875rem;
        font-weight: 500;
        border-radius: 8px;
        text-decoration: none;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
      }
      .btn-primary {
        background: linear-gradient(90deg, #06b6d4, #2563eb);
        color: white;
        box-shadow: 0 4px 14px rgba(6, 182, 212, 0.2);
      }
      .btn-primary:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: transparent;
        color: #475569;
        border: 1px solid #cbd5e1;
      }
      .btn-secondary:hover {
        background: #f1f5f9;
        border-color: #94a3b8;
      }
      .logo {
        margin-bottom: 32px;
        height: 48px;
        opacity: 0.7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f1f5f9;
        }
        .code {
          color: #1e293b;
        }
        h1 {
          color: #f1f5f9;
        }
        p {
          color: #94a3b8;
        }
        .btn-secondary {
          color: #cbd5e1;
          border-color: #334155;
        }
        .btn-secondary:hover {
          background: #1e293b;
          border-color: #475569;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        class="logo"
        src="/images/SKYWORLD_SOLUTIONS.png"
        alt="Skyworld Solutions"
        style="filter: brightness(0.3)"
      />
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/"> Back to Home </a>
        <button class="btn btn-secondary" onclick="window.history.back()">Go Back</button>
      </div>
    </div>
  </body>
</html>
